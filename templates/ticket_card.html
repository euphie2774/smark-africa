<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ticket card</title>
<style>@page{size:85.60mm 53.98mm;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}.ticket{width:85.60mm;height:53.98mm;padding:4mm;overflow:hidden;border:1px solid #ccc;display:flex;flex-direction:column;justify-content:space-between}h1{font-size:14pt;margin:0;max-height:13mm;overflow:hidden}p{font-size:10pt;margin:0}.barcode{height:20mm;width:100%}.barcode svg{width:100%;height:100%}footer{font-size:8pt}@media print{button{display:none}.ticket{border:0}}</style></head>
<body><article class="ticket"><h1>{{ service.title }}</h1><p><strong>{{ admission.order.tier.name if admission.order.tier else 'Regular' }}</strong> · Ticket #{{ admission.id }}{% if admission.allocated_seat is not none %} · Seat {{ admission.allocated_seat }}{% endif %}</p><div class="barcode">{{ barcode|safe }}</div><footer>Designed by Smark-Africa.com</footer></article><button onclick="window.print()">Print card</button></body></html>
